<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Conserto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="conserto.css">
    <script src="theme.js"></script>
    <style>
        /* ============================================
   VARIÁVEIS DE TEMA (claro/escuro/auto)
   ============================================ */
:root {
  --bg-body: #f5f7fa;
  --bg-card: #ffffff;
  --bg-input: #fafbfc;
  --bg-menu: #ffffff;
  --bg-menu-hover: #f7fafc;
  --bg-form: #ffffff;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --text-menu: #2d3748;
  --border-color: #e2e8f0;
  --border-input: #e2e8f0;
  --border-focus: #3b82f6;
  --shadow: 0 20px 60px rgba(0,0,0,0.08);
  --shadow-hover: 0 24px 70px rgba(0,0,0,0.12);
  --accent: #3b82f6;
  --accent-gradient: linear-gradient(135deg, #1e4f8a 0%, #0c2b4f 100%);
  --accent-hover: #2563eb;
  --accent-light: #e9effa;
  --btn-outline-border: #e2e8f0;
  --btn-outline-text: #64748b;
  --btn-outline-hover: #f1f5f9;
  --divider-color: #f1f5f9;
  --shadow-focus: rgba(59,130,246,0.08);
  --shadow-btn: rgba(59,130,246,0.3);
  --shadow-btn-hover: rgba(59,130,246,0.35);
}

/* Tema escuro */
body.theme-escuro {
  --bg-body: #0b1424;
  --bg-card: #1a2a3f;
  --bg-input: #25344d;
  --bg-menu: #1a2a3f;
  --bg-menu-hover: #2a3f5a;
  --bg-form: #1a2a3f;
  --text-primary: #e8edf5;
  --text-secondary: #a0b3cc;
  --text-muted: #8899bb;
  --text-menu: #e8edf5;
  --border-color: #2a3f5a;
  --border-input: #2a3f5a;
  --border-focus: #60a5fa;
  --shadow: 0 20px 60px rgba(0,0,0,0.4);
  --shadow-hover: 0 24px 70px rgba(0,0,0,0.5);
  --accent: #60a5fa;
  --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1e4f8a 100%);
  --accent-hover: #3b82f6;
  --accent-light: #1a2a3f;
  --btn-outline-border: #2a3f5a;
  --btn-outline-text: #a0b3cc;
  --btn-outline-hover: #2a3f5a;
  --divider-color: #2a3f5a;
  --shadow-focus: rgba(96,165,250,0.15);
  --shadow-btn: rgba(59,130,246,0.3);
  --shadow-btn-hover: rgba(59,130,246,0.4);
}

/* Tema automático */
@media (prefers-color-scheme: dark) {
  body.theme-auto {
    --bg-body: #0b1424;
    --bg-card: #1a2a3f;
    --bg-input: #25344d;
    --bg-menu: #1a2a3f;
    --bg-menu-hover: #2a3f5a;
    --bg-form: #1a2a3f;
    --text-primary: #e8edf5;
    --text-secondary: #a0b3cc;
    --text-muted: #8899bb;
    --text-menu: #e8edf5;
    --border-color: #2a3f5a;
    --border-input: #2a3f5a;
    --border-focus: #60a5fa;
    --shadow: 0 20px 60px rgba(0,0,0,0.4);
    --shadow-hover: 0 24px 70px rgba(0,0,0,0.5);
    --accent: #60a5fa;
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1e4f8a 100%);
    --accent-hover: #3b82f6;
    --accent-light: #1a2a3f;
    --btn-outline-border: #2a3f5a;
    --btn-outline-text: #a0b3cc;
    --btn-outline-hover: #2a3f5a;
    --divider-color: #2a3f5a;
    --shadow-focus: rgba(96,165,250,0.15);
    --shadow-btn: rgba(59,130,246,0.3);
    --shadow-btn-hover: rgba(59,130,246,0.4);
  }
}

/* ============================================
   TAMANHOS DE FONTE (base em px, filhos em em)
   ============================================ */
html, body {
  font-size: 16px;
  font-family: 'Inter', sans-serif;
}
body {
  transition: background 0.3s, color 0.3s;
}
body.font-pequeno { font-size: 14px; }
body.font-medio  { font-size: 16px; }
body.font-grande { font-size: 20px; }

* {
  font-size: inherit;
}

h1 { font-size: 1.8em; }
.sub { font-size: 0.9em; }
label { font-size: 0.85em; }
input, select, textarea { font-size: 1em; }
.btn { font-size: 0.95em; }

/* ============================================
   ESTILOS DO MENU (compatível com as outras páginas)
   ============================================ */
.menu-trigger {
  position: fixed;
  left: 30px;
  top: 30px;
  width: 55px;
  height: 55px;
  background: var(--accent-gradient);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
  transition: all 0.3s ease;
  z-index: 1001;
}
.menu-trigger:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}
.menu-trigger i {
  font-size: 24px;
  color: white;
}

.side-menu {
  position: fixed;
  left: -300px;
  top: 0;
  width: 300px;
  height: 100vh;
  background: var(--bg-menu);
  box-shadow: -5px 0 25px rgba(0, 0, 0, 0.1);
  transition: left 0.5s cubic-bezier(0.4, 0, 0.22, 1);
  z-index: 1000;
  overflow-y: auto;
}
.menu-trigger:hover + .side-menu,
.side-menu:hover {
  left: 0;
}

.menu-header {
  background: var(--accent-gradient);
  color: white;
  padding: 2rem 1.5rem;
  text-align: center;
}
.user-avatar {
  width: 80px;
  height: 80px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  margin: 0 auto 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
}
.menu-header h3 {
  font-size: 1.2em;
  margin-bottom: 0.25rem;
}
.menu-header p {
  font-size: 0.8em;
  opacity: 0.9;
}

.menu-items {
  padding: 1rem 0;
}
.menu-item {
  display: flex;
  align-items: center;
  padding: 0.9rem 1.5rem;
  color: var(--text-menu);
  text-decoration: none;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
  gap: 12px;
}
.menu-item:hover {
  background: var(--bg-menu-hover);
  border-left-color: var(--accent);
  padding-left: 2rem;
}
.menu-item i {
  width: 30px;
  font-size: 1.2em;
  color: var(--accent);
}
.menu-item span {
  font-size: 0.95em;
  font-weight: 500;
}
.menu-divider {
  height: 1px;
  background: var(--border-color);
  margin: 0.8rem 1.5rem;
}

/* ============================================
   ESTILOS DO FORMULÁRIO
   ============================================ */
body {
  background: var(--bg-body);
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: var(--text-primary);
}

.form-container {
  max-width: 900px;
  width: 100%;
  background: var(--bg-form);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 40px 48px;
  transition: background 0.3s, box-shadow 0.3s;
}
@media (max-width: 700px) {
  .form-container {
    padding: 24px 18px;
  }
}

.form-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  border-bottom: 2px solid var(--divider-color);
  padding-bottom: 20px;
}
.form-header i {
  font-size: 2rem;
  color: var(--accent);
}
.form-header h1 {
  font-weight: 700;
  color: var(--text-primary);
}
.form-header .sub {
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 12px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 30px;
  margin-bottom: 24px;
}
.form-row.full {
  grid-template-columns: 1fr;
}
@media (max-width: 700px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.input-group label {
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.3px;
}
.input-group label i {
  margin-right: 6px;
  color: var(--accent);
  width: 18px;
}
.input-group input,
.input-group select,
.input-group textarea {
  padding: 12px 16px;
  border: 1.5px solid var(--border-input);
  border-radius: 12px;
  transition: 0.2s;
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  background: var(--bg-form);
  box-shadow: 0 0 0 4px var(--shadow-focus);
}
.input-group textarea {
  resize: vertical;
  min-height: 80px;
}

.actions-bar {
  display: flex;
  justify-content: flex-end;
  gap: 16px;
  margin-top: 32px;
  border-top: 1px solid var(--divider-color);
  padding-top: 24px;
}
@media (max-width: 700px) {
  .actions-bar {
    flex-wrap: wrap;
    justify-content: center;
  }
}

.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: 0.2s;
}
.btn-outline {
  background: transparent;
  color: var(--btn-outline-text);
  border: 1.5px solid var(--btn-outline-border);
}
.btn-outline:hover {
  background: var(--btn-outline-hover);
}
.btn-success {
  background: var(--accent-gradient);
  color: white;
  box-shadow: 0 4px 12px var(--shadow-btn);
}
.btn-success:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px var(--shadow-btn-hover);
}
.btn-success i {
  font-size: 1.1rem;
}

/* Ajuste para mobile */
@media (max-width: 550px) {
  .side-menu {
    width: 260px;
  }
  .menu-trigger {
    left: 15px;
    top: 15px;
    width: 45px;
    height: 45px;
  }
  .menu-trigger i {
    font-size: 18px;
  }
}

/* Suporte para abrir/fechar menu mobile */
.side-menu.open {
  left: 0 !important;
}
        /* Ajuste extra para o menu mobile */
        .side-menu.open {
            left: 0 !important;
        }
        @media (max-width: 550px) {
            .menu-trigger {
                left: 15px !important;
                top: 15px !important;
                width: 45px !important;
                height: 45px !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MENU TRIGGER ===== -->
    <div class="menu-trigger" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <!-- ===== MENU LATERAL ===== -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <h3>Olá, Usuário</h3>
            <p><i class="fas fa-envelope"></i> financeiro@empresa.com</p>
        </div>
        <div class="menu-items">
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='menu.html'">
                <i class="fa fa-home"></i><span>Início</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastrocliente.html'">
                <i class="fas fa-address-card"></i><span>Cadastro de Clientes</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastrofuncionario.html'">
                <i class="fas fa-users"></i><span>Cadastro de Funcionários</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastroprodutos.html'">
                <i class="fas fa-box"></i><span>Cadastro de Produtos</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='extrato.html'">
                <i class="fas fa-file-invoice"></i><span>Extrato</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='orçamento.html'">
                <i class="fas fa-calculator"></i><span>Orçamento</span>
            </a>
            <div class="menu-divider"></div>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='configuração.html'">
                <i class="fas fa-cog"></i><span>Configuração</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='suporte.html'">
                <i class="fas fa-headset"></i><span>Suporte</span>
            </a>
            <a class="menu-item" href="javascript:void(0)" onclick="if(confirm('Tem certeza que deseja sair?')) window.location.href='login.html'">
                <i class="fas fa-sign-out-alt"></i><span>Sair</span>
            </a>
        </div>
    </div>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <div class="form-container">
        <div class="form-header">
            <i class="fas fa-plus-circle"></i>
            <div>
                <h1>Nova Ordem de Conserto</h1>
                <span class="sub">Preencha os dados do serviço</span>
            </div>
        </div>

        <form id="formOrdem">
            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Cliente</label>
                    <input type="text" id="clienteNome" placeholder="Nome do cliente ou empresa" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-print"></i> Equipamento</label>
                    <input type="text" id="equipamentoNome" placeholder="Ex: Impressora HP LaserJet" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-layer-group"></i> Tipo</label>
                    <select id="equipamentoTipo">
                        <option value="impressora">🖨️ Impressora</option>
                        <option value="scanner">📄 Scanner</option>
                        <option value="notebook">💻 Notebook</option>
                        <option value="celular">📱 Celular</option>
                        <option value="outros">🧰 Outros</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-exclamation-triangle"></i> Defeito relatado</label>
                    <input type="text" id="defeitoRelatado" placeholder="Descreva o problema" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-flag"></i> Prioridade</label>
                    <select id="prioridade">
                        <option value="baixa">Baixa</option>
                        <option value="media" selected>Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-info-circle"></i> Status</label>
                    <select id="statusServico">
                        <option value="recebido">Recebido</option>
                        <option value="analise">Em análise</option>
                        <option value="conserto">Em conserto</option>
                        <option value="aguardando">Aguardando peça</option>
                        <option value="finalizado">Finalizado</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-dollar-sign"></i> Valor estimado (R$)</label>
                    <input type="number" id="valorEstimado" placeholder="0,00" step="0.01">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-comment-dots"></i> Observações</label>
                    <input type="text" id="observacoes" placeholder="Informações adicionais">
                </div>
            </div>

            <div class="actions-bar">
                <button type="button" class="btn btn-outline" id="btnLimparForm"><i class="fas fa-eraser"></i> Limpar</button>
                <button type="submit" class="btn btn-success" id="btnSalvarServico"><i class="fas fa-save"></i> Salvar Ordem</button>
            </div>
        </form>
    </div>

    <script>
        // ===== CONTROLE DO MENU HAMBURGER =====
        const menuToggle = document.getElementById('menuToggle');
        const sideMenu = document.getElementById('sideMenu');

        if (menuToggle && sideMenu) {
            menuToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                sideMenu.classList.toggle('open');
            });

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    if (!sideMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        sideMenu.classList.remove('open');
                    }
                }
            });

            sideMenu.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        sideMenu.classList.remove('open');
                    }
                });
            });
        }

        // ===== LÓGICA DO FORMULÁRIO =====
        let editandoId = null;

        function carregarDadosEdicao() {
            const dados = localStorage.getItem('editarConserto');
            if (dados) {
                const item = JSON.parse(dados);
                document.getElementById('clienteNome').value = item.cliente;
                document.getElementById('equipamentoNome').value = item.equipamento;
                document.getElementById('equipamentoTipo').value = item.tipo;
                document.getElementById('defeitoRelatado').value = item.defeito;
                document.getElementById('prioridade').value = item.prioridade;
                document.getElementById('statusServico').value = item.status;
                document.getElementById('valorEstimado').value = item.valor;
                document.getElementById('observacoes').value = item.observacoes;
                editandoId = item.id;
                document.getElementById('btnSalvarServico').innerHTML = '<i class="fas fa-save"></i> Atualizar Ordem';
                localStorage.removeItem('editarConserto');
            }
        }

        function salvarServico(e) {
            e.preventDefault();
            const cliente = document.getElementById('clienteNome').value.trim();
            const equipamento = document.getElementById('equipamentoNome').value.trim();
            const tipo = document.getElementById('equipamentoTipo').value;
            const defeito = document.getElementById('defeitoRelatado').value.trim();
            const prioridade = document.getElementById('prioridade').value;
            const status = document.getElementById('statusServico').value;
            const valor = parseFloat(document.getElementById('valorEstimado').value) || 0;
            const observacoes = document.getElementById('observacoes').value.trim();

            if (!cliente || !equipamento || !defeito) {
                alert('Preencha cliente, equipamento e defeito para cadastrar a ordem.');
                return;
            }

            let servicos = JSON.parse(localStorage.getItem('techConsertos') || '[]');

            if (editandoId) {
                servicos = servicos.map(item => item.id === editandoId ? { ...item, cliente, equipamento, tipo, defeito, prioridade, status, valor, observacoes } : item);
            } else {
                servicos.push({ id: Date.now(), cliente, equipamento, tipo, defeito, prioridade, status, valor, observacoes });
            }

            localStorage.setItem('techConsertos', JSON.stringify(servicos));
            alert('Ordem salva com sucesso!');
            limparFormulario();
            // Recarrega a lista se estiver em um iframe
            if (window.parent) {
                window.parent.postMessage('recarregarLista', '*');
            }
        }

        function limparFormulario() {
            document.getElementById('clienteNome').value = '';
            document.getElementById('equipamentoNome').value = '';
            document.getElementById('equipamentoTipo').value = 'impressora';
            document.getElementById('defeitoRelatado').value = '';
            document.getElementById('prioridade').value = 'media';
            document.getElementById('statusServico').value = 'recebido';
            document.getElementById('valorEstimado').value = '';
            document.getElementById('observacoes').value = '';
            editandoId = null;
            document.getElementById('btnSalvarServico').innerHTML = '<i class="fas fa-save"></i> Salvar Ordem';
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosEdicao();
            document.getElementById('btnSalvarServico').addEventListener('click', salvarServico);
            document.getElementById('btnLimparForm').addEventListener('click', limparFormulario);
        });
    </script>
</body>
</html>
