<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Dashboard Completo</title>
    <link href="extrato.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
    <head>
        <body>
                <div class="menu-trigger">
        <i class="fas fa-bars"></i>
    </div>

    <div class="side-menu">
        <div class="menu-header">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <h3>Olá, Usuário</h3>
            <p><i class="fas fa-envelope"></i> financeiro@empresa.com</p>
        </div>
        <div class="menu-items">
            <!-- Botão para inicio -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='menu.html'">
                <i class="fa fa-home" aria-hidden="true"></i><span>Inicio</span>
            </a>

            <!-- Botão para Cadastro de Clientes -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastrocliente.html'">
                <i class="fas fa-address-card"></i><span>Cadastro de Clientes</span>
            </a>
            
            <!-- Botão para Cadastro de Funcionários -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastrofuncionario.html'">
                <i class="fas fa-users"></i><span>Cadastro de Funcionários</span>
            </a>
            
            <!-- Botão para Cadastro de Produtos (NOVO) -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='cadastroprodutos.html'">
                <i class="fas fa-box"></i><span>Cadastro de Produtos</span>
            </a>
            
            <!-- Botão para Extrato -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='extrato.html'">
                <i class="fas fa-file-invoice"></i><span>Extrato</span>
            </a>

            <!-- Botão para Orçamento -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='orçamento.html'">
                <i class="fas fa-calculator"></i><span>Orçamento</span>
            </a>
            
            <div class="menu-divider"></div>
            
            <!-- Botão para Configuração -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='configuração.html'">
                <i class="fas fa-cog"></i><span>Configuração</span>
            </a>
            
            <!-- Botão para Suporte -->
            <a class="menu-item" href="javascript:void(0)" onclick="window.location.href='suporte.html'">
                <i class="fas fa-headset"></i><span>Suporte</span>
            </a>
            
            <!-- Botão para Sair (com confirmação) -->
            <a class="menu-item" href="javascript:void(0)" onclick="if(confirm('Tem certeza que deseja sair?')) window.location.href='login.html'">
                <i class="fas fa-sign-out-alt"></i><span>Sair</span>
            </a>
        </div>
    </div>
        </body>
    </head>
</head>
<body>

<div class="container">
    
    <header class="header">
        <h1><i class="fas fa-chart-line"></i> Extrato Financeiro</h1>
        <div class="date-selector">
            <input type="date" id="dateFilter" class="date-input" value="2026-03-28">
            <div style="color: var(--text-light); font-size: 14px;">
                <i class="far fa-clock"></i> <span id="lastUpdate">28/03/2026 11:41</span>
            </div>
        </div>
    </header>

    <div class="stats-grid" id="statsGrid">
        <!-- Stats serão preenchidos dinamicamente -->
    </div>

    <div class="charts-row">
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> Composição dos Ganhos</h3>
            <div class="donut-container">
                <canvas id="donutChart" width="250" height="250"></canvas>
                <div class="chart-stats" id="chartStats">
                    <!-- Stats do gráfico -->
                </div>
            </div>
        </div>
        
        <div class="chart-card">
            <h3><i class="fas fa-chart-line"></i> Evolução Diária</h3>
            <canvas id="trendChart" width="400" height="250"></canvas>
        </div>
    </div>

    <div class="goal-container" id="goalContainer">
        <!-- Meta será preenchida dinamicamente -->
    </div>

    <div class="transactions">
        <div class="trans-header">
            <h3 style="margin: 0;"><i class="fas fa-list"></i> Transações • <span id="currentDate">28/03/2026</span></h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="search-box">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Buscar descrição ou produto...">
                    <i class="fas fa-search"></i>
                </div>
                <div class="filter-group">
                    <select id="categoryFilter" class="filter-select" onchange="filterTable()">
                        <option value="all">Todas categorias</option>
                        <option value="Vendas">Vendas</option>
                        <option value="Serviços">Serviços</option>
                    </select>
                </div>
            </div>
        </div>
        <table id="transTable">
            <thead>
                <tr>
                    <th>CATEGORIA</th>
                    <th>DESCRIÇÃO</th>
                    <th>VALOR</th>
                    <th>HORA</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dados serão preenchidos dinamicamente -->
            </tbody>
        </table>
        <div class="summary-bar" id="tableSummary">
            <!-- Resumo da tabela -->
        </div>
        <div class="export-btns">
            <button class="btn btn-pdf" onclick="exportToPDF()"><i class="far fa-file-pdf"></i> Exportar PDF</button>
            <button class="btn btn-excel" onclick="exportToExcel()"><i class="far fa-file-excel"></i> Exportar Excel</button>
        </div>
    </div>

</div>

<script>
    // Dados completos
    let transactionsData = [
        { categoria: "Vendas", descricao: "Kit de Ferramentas Profissional", valor: 489.90, hora: "11:30", status: "Concluído" },
        { categoria: "Serviços", descricao: "Instalação de Ar Condicionado", valor: 320.00, hora: "11:15", status: "Concluído" },
        { categoria: "Vendas", descricao: "3x Camisetas Básicas", valor: 119.70, hora: "10:50", status: "Concluído" },
        { categoria: "Serviços", descricao: "Manutenção Preventiva em Motor", valor: 450.00, hora: "10:25", status: "Concluído" },
        { categoria: "Vendas", descricao: "Parafusos e Porcas Industrial", valor: 280.00, hora: "09:55", status: "Concluído" },
        { categoria: "Vendas", descricao: "Furadeira de Impacto", valor: 350.00, hora: "09:30", status: "Concluído" },
        { categoria: "Serviços", descricao: "Consultoria Técnica", valor: 500.00, hora: "09:00", status: "Concluído" },
        { categoria: "Vendas", descricao: "Lâmpadas LED (lote)", valor: 180.00, hora: "08:45", status: "Concluído" },
        { categoria: "Vendas", descricao: "Carregador Portátil", valor: 89.90, hora: "08:30", status: "Concluído" },
        { categoria: "Serviços", descricao: "Manutenção de Computador", valor: 250.00, hora: "08:15", status: "Concluído" },
        { categoria: "Vendas", descricao: "Monitor LED 24''", valor: 850.00, hora: "14:30", status: "Pendente" },
        { categoria: "Serviços", descricao: "Desenvolvimento Web", valor: 1200.00, hora: "15:45", status: "Pendente" }
    ];

    let gastosData = [
        { descricao: "Fornecedores", valor: 800.00, categoria: "Compra" },
        { descricao: "Impostos", valor: 250.00, categoria: "Taxas" },
        { descricao: "Frete", valor: 150.00, categoria: "Logística" }
    ];

    let totalGastos = 1200.00;
    let metaDiaria = 5000.00;
    let totalVendas = 0;
    let totalServicos = 0;
    let donutChart, trendChart;

    // Calcular totais
    function calculateTotals() {
        totalVendas = transactionsData.filter(t => t.categoria === "Vendas").reduce((sum, t) => sum + t.valor, 0);
        totalServicos = transactionsData.filter(t => t.categoria === "Serviços").reduce((sum, t) => sum + t.valor, 0);
    }

    // Atualizar cards
    function updateStats() {
        calculateTotals();
        const totalGeral = totalVendas + totalServicos;
        const lucroLiquido = totalGeral - totalGastos;
        const ticketMedio = totalVendas / transactionsData.filter(t => t.categoria === "Vendas").length;
        const percentChange = ((totalGeral - 4330) / 4330 * 100).toFixed(1);
        
        const statsGrid = document.getElementById('statsGrid');
        statsGrid.innerHTML = `
            <div class="card">
                <div class="card-label"><i class="fas fa-chart-simple"></i> Total Geral</div>
                <div class="card-value">R$ ${totalGeral.toFixed(2)}</div>
                <div class="card-sub ${percentChange >= 0 ? 'trend-up' : 'trend-down'}">
                    <i class="fas fa-arrow-${percentChange >= 0 ? 'up' : 'down'}"></i> ${Math.abs(percentChange)}% em relação a ontem
                </div>
            </div>
            <div class="card">
                <div class="card-label"><i class="fas fa-dollar-sign"></i> Ganhos Hoje</div>
                <div class="card-value">R$ ${totalGeral.toFixed(2)}</div>
                <div class="card-sub">${transactionsData.length} transações realizadas</div>
            </div>
            <div class="card">
                <div class="card-label"><i class="fas fa-shopping-cart"></i> Vendas</div>
                <div class="card-value">${transactionsData.filter(t => t.categoria === "Vendas").length}</div>
                <div class="card-sub">Ticket Médio: R$ ${ticketMedio.toFixed(2)}</div>
            </div>
            <div class="card">
                <div class="card-label"><i class="fas fa-receipt"></i> Lucro Líquido</div>
                <div class="card-value">R$ ${lucroLiquido.toFixed(2)}</div>
                <div class="card-sub trend-down"><i class="fas fa-arrow-down"></i> Gastos: R$ ${totalGastos.toFixed(2)}</div>
            </div>
        `;
    }

    // Atualizar gráfico donut
    function updateDonutChart() {
        const vendasPercent = (totalVendas / (totalVendas + totalServicos) * 100).toFixed(1);
        const servicosPercent = (totalServicos / (totalVendas + totalServicos) * 100).toFixed(1);
        
        if (donutChart) donutChart.destroy();
        
        const ctx = document.getElementById('donutChart').getContext('2d');
        donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Vendas', 'Serviços'],
                datasets: [{
                    data: [totalVendas, totalServicos],
                    backgroundColor: ['#0a5d3e', '#1a73e8'],
                    borderWidth: 0,
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const value = context.raw;
                                const percent = ((value / (totalVendas + totalServicos)) * 100).toFixed(1);
                                return `${context.label}: R$ ${value.toFixed(2)} (${percent}%)`;
                            }
                        }
                    }
                },
                onClick: function(event, activeElements) {
                    if (activeElements.length > 0) {
                        const index = activeElements[0].dataIndex;
                        const categoria = index === 0 ? 'Vendas' : 'Serviços';
                        const valor = index === 0 ? totalVendas : totalServicos;
                        alert(`${categoria}\nTotal: R$ ${valor.toFixed(2)}\nPercentual: ${((valor/(totalVendas+totalServicos))*100).toFixed(1)}%`);
                    }
                }
            }
        });
        
        document.getElementById('chartStats').innerHTML = `
            <div class="stat-item">
                <div class="stat-label"><i class="fas fa-tag" style="color: #0a5d3e;"></i> Vendas</div>
                <div class="stat-value">R$ ${totalVendas.toFixed(2)}</div>
                <div style="font-size: 12px; color: #666;">${vendasPercent}% do total</div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><i class="fas fa-cogs" style="color: #1a73e8;"></i> Serviços</div>
                <div class="stat-value">R$ ${totalServicos.toFixed(2)}</div>
                <div style="font-size: 12px; color: #666;">${servicosPercent}% do total</div>
            </div>
            <div class="stat-item">
                <div class="stat-label"><i class="fas fa-chart-line"></i> Média por Transação</div>
                <div class="stat-value">R$ ${((totalVendas + totalServicos) / transactionsData.length).toFixed(2)}</div>
            </div>
        `;
    }

    // Atualizar gráfico de tendência
    function updateTrendChart() {
        const ultimosDias = [3250, 3480, 4120, 3890, 4350, 4680, totalVendas + totalServicos];
        
        if (trendChart) trendChart.destroy();
        
        const ctx = document.getElementById('trendChart').getContext('2d');
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['22/03', '23/03', '24/03', '25/03', '26/03', '27/03', 'Hoje'],
                datasets: [{
                    label: 'Ganhos Diários (R$)',
                    data: ultimosDias,
                    borderColor: '#0a5d3e',
                    backgroundColor: 'rgba(10, 93, 62, 0.1)',
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#1a73e8',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `R$ ${context.raw.toFixed(2)}`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'R$ ' + value.toFixed(0);
                            }
                        }
                    }
                }
            }
        });
    }

    // Atualizar meta
    function updateGoal() {
        const totalGeral = totalVendas + totalServicos;
        const percentual = (totalGeral / metaDiaria * 100).toFixed(1);
        const falta = Math.max(0, metaDiaria - totalGeral);
        
        document.getElementById('goalContainer').innerHTML = `
            <div class="goal-header">
                <div>
                    <span class="card-label"><i class="fas fa-bullseye"></i> Meta Diária</span>
                    <div class="goal-title">R$ ${metaDiaria.toFixed(2)}</div>
                </div>
                <div class="goal-percent">${percentual}%</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${Math.min(percentual, 100)}%;"></div>
            </div>
            <div class="goal-footer">
                <span><i class="fas fa-chart-line"></i> Progresso: R$ ${totalGeral.toFixed(2)}</span>
                <span><i class="fas fa-hourglass-half"></i> ${falta > 0 ? `Faltam R$ ${falta.toFixed(2)}` : 'Meta alcançada, Parabéns!'}</span>
            </div>
        `;
    }

    // Preencher tabela
    function populateTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const categoryFilter = document.getElementById('categoryFilter').value;
        
        let filteredData = transactionsData.filter(transacao => {
            const matchSearch = transacao.descricao.toLowerCase().includes(searchTerm);
            const matchCategory = categoryFilter === 'all' || transacao.categoria === categoryFilter;
            return matchSearch && matchCategory;
        });
        
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        
        filteredData.forEach(transacao => {
            const row = tableBody.insertRow();
            row.innerHTML = `
                <td><span class="cat-badge ${transacao.categoria === 'Vendas' ? 'cat-vendas' : 'cat-servicos'}">${transacao.categoria}</span></td>
                <td><strong>${transacao.descricao}</strong></td>
                <td style="color: ${transacao.categoria === 'Vendas' ? '#27ae60' : '#3498db'}; font-weight: 600;">R$ ${transacao.valor.toFixed(2)}</td>
                <td><i class="far fa-clock"></i> ${transacao.hora}</td>
                <td><span style="padding: 3px 10px; border-radius: 12px; background: ${transacao.status === 'Concluído' ? '#e8f5e9' : '#fff3e0'}; font-size: 12px;">${transacao.status}</span></td>
            `;
        });
        
        // Resumo da tabela
        const totalFiltrado = filteredData.reduce((sum, t) => sum + t.valor, 0);
        document.getElementById('tableSummary').innerHTML = `
            <span><i class="fas fa-list-ul"></i> ${filteredData.length} transações exibidas</span>
            <span><i class="fas fa-dollar-sign"></i> Total filtrado: R$ ${totalFiltrado.toFixed(2)}</span>
        `;
    }

    // Função de busca
    function filterTable() {
        populateTable();
    }

    // Exportar para Excel
    function exportToExcel() {
        const wsData = [["Categoria", "Descrição", "Valor (R$)", "Hora", "Status"]];
        transactionsData.forEach(t => {
            wsData.push([t.categoria, t.descricao, t.valor, t.hora, t.status]);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Transacoes");
        XLSX.writeFile(wb, `extrato_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // Exportar para PDF
    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(20);
        doc.setTextColor(10, 93, 62);
        doc.text("Extrato Financeiro", 14, 20);
        
        doc.setFontSize(12);
        doc.setTextColor(100, 100, 100);
        doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 14, 30);
        
        const tableData = transactionsData.map(t => [t.categoria, t.descricao, `R$ ${t.valor.toFixed(2)}`, t.hora]);
        
        doc.autoTable({
            head: [["Categoria", "Descrição", "Valor", "Hora"]],
            body: tableData,
            startY: 40,
            theme: 'striped',
            headStyles: { fillColor: [10, 93, 62] },
            styles: { fontSize: 9 }
        });
        
        const totalGeral = totalVendas + totalServicos;
        doc.text(`Total Geral: R$ ${totalGeral.toFixed(2)}`, 14, doc.lastAutoTable.finalY + 10);
        
        doc.save(`extrato_${new Date().toISOString().split('T')[0]}.pdf`);
    }

    // Inicializar tudo
    function init() {
        calculateTotals();
        updateStats();
        updateDonutChart();
        updateTrendChart();
        updateGoal();
        populateTable();
        
        // Atualizar data atual
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('pt-BR');
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('pt-BR');
        
        // Adicionar evento para o filtro de data
        document.getElementById('dateFilter').addEventListener('change', function(e) {
            document.getElementById('currentDate').textContent = new Date(e.target.value).toLocaleDateString('pt-BR');
        });
    }
    
    init();
</script>

</body>
</html>
