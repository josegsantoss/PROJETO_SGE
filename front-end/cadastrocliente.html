<body>

<div class="container">
  <div class="novo-cliente">
    <h2>Novo Cliente</h2>
    
    <div class="form-grid">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: João Silva Santos">
      </div>
      <div class="form-group">
        <label>CPF / CNPJ</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="cliente@exemplo.com">
      </div>

      <div class="form-group">
        <label>Telefone</label>
        <input type="tel" id="telefone" placeholder="(81) 99999-9999">
      </div>

      <div class="form-group">
        <label>Celular / WhatsApp</label>
        <input type="tel" id="celular" placeholder="(81) 98888-8888">
      </div>

      <div class="form-group">
        <label>Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro">
      </div>

      <div class="form-group">
        <label>Cidade</label>
        <input type="text" id="cidade" value="Caruaru">
      </div>

      <div class="form-group">
        <label>Estado</label>
        <input type="text" id="estado" value="PE" style="width: 100px;">
      </div>

      <div class="form-group">
        <label>CEP</label>
        <input type="text" id="cep" value="55000-000">
      </div>

      <div class="form-group">
        <label>Tipo de Cliente</label>
        <div class="tipo-cliente">
          <label class="radio-group">
            <input type="radio" name="tipo" value="Física" checked> Pessoa Física
          </label>
          <label class="radio-group">
            <input type="radio" name="tipo" value="Jurídica"> Pessoa Jurídica
          </label>
        </div>
      </div>
    </div>

    <button class="btn-cadastrar" onclick="cadastrarCliente()">Cadastrar Cliente</button>
  </div>

  <!-- Clientes Cadastrados -->
  <div class="clientes-cadastrados">
    <div class="clientes-header">
      <h3>👥 Clientes Cadastrados</h3>
      <input type="text" id="search" class="search-input" placeholder="🔍 Buscar por nome, CPF ou data..." onkeyup="filtrarClientes()">
    </div>

    <table id="tabelaClientes">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF/CNPJ</th>
          <th>Telefone</th>
          <th>Tipo</th>
          <th>Data de Cadastro</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button class="exportar" onclick="exportarClientes()">⬇ Exportar Clientes</button>
  </div>

</div>

<script>
// Array de clientes (carregado do localStorage)
let clientes = JSON.parse(localStorage.getItem('clientes')) || [];

// Função para renderizar a tabela
function renderizarTabela(filteredClientes = clientes) {
  const tbody = document.querySelector('#tabelaClientes tbody');
  tbody.innerHTML = '';

  filteredClientes.forEach((cliente, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${cliente.nome}</td>
      <td>${cliente.cpf}</td>
      <td>${cliente.celular || cliente.telefone}</td>
      <td>${cliente.tipo}</td>
      <td>${cliente.dataCadastro}</td>
      <td><button class="btn-ver" onclick="verCliente(${index})">Ver</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Cadastrar novo cliente
function cadastrarCliente() {
  const nome = document.getElementById('nome').value.trim();
  const cpf = document.getElementById('cpf').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const celular = document.getElementById('celular').value.trim();
  const endereco = document.getElementById('endereco').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  const estado = document.getElementById('estado').value.trim();
  const cep = document.getElementById('cep').value.trim();
  const tipo = document.querySelector('input[name="tipo"]:checked').value;

  if (!nome || !cpf) {
    alert('Nome e CPF/CNPJ são obrigatórios!');
    return;
  }

  const novoCliente = {
    nome,
    cpf,
    email,
    telefone,
    celular,
    endereco,
    cidade,
    estado,
    cep,
    tipo,
    dataCadastro: new Date().toLocaleDateString('pt-BR')
  };

  clientes.unshift(novoCliente); // adiciona no topo
  localStorage.setItem('clientes', JSON.stringify(clientes));

  renderizarTabela();
  alert('Cliente cadastrado com sucesso!');

  // Limpa o formulário
  document.querySelectorAll('input').forEach(input => {
    if (input.type !== 'radio') input.value = '';
  });
  document.getElementById('cidade').value = 'Caruaru';
  document.getElementById('estado').value = 'PE';
  document.getElementById('cep').value = '55000-000';
}

// Filtrar clientes (busca)
function filtrarClientes() {
  const termo = document.getElementById('search').value.toLowerCase().trim();
  if (!termo) {
    renderizarTabela();
    return;
  }

  const filtrados = clientes.filter(cliente => 
    cliente.nome.toLowerCase().includes(termo) ||
    cliente.cpf.toLowerCase().includes(termo) ||
    cliente.dataCadastro.includes(termo)
  );

  renderizarTabela(filtrados);
}

// Ver cliente (simples alerta por enquanto)
function verCliente(index) {
  const cliente = clientes[index];
  alert(`Nome: ${cliente.nome}\nCPF/CNPJ: ${cliente.cpf}\nTipo: ${cliente.tipo}\nData: ${cliente.dataCadastro}\nTelefone: ${cliente.celular || cliente.telefone}`);
}

// Exportar para CSV
function exportarClientes() {
  if (clientes.length === 0) {
    alert('Não há clientes para exportar.');
    return;
  }

  let csv = 'Nome,CPF/CNPJ,Tipo,Data de Cadastro,Telefone,Celular,Email\n';
  clientes.forEach(c => {
    csv += `"${c.nome}","${c.cpf}","${c.tipo}","${c.dataCadastro}","${c.telefone}","${c.celular}","${c.email}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'clientes.csv';
  link.click();
}

// Inicializa a página
renderizarTabela();
</script>

</body>
