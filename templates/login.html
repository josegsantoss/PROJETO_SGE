      </svg>
    </div>

    <h1>Bem-vindo</h1>

    <form id="loginForm" method="POST" action="/">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
        
        <div class="mostrar-senha-wrapper">
          <label class="checkbox-container">
            <input type="checkbox" id="mostrarSenhaCheckbox">
            <span>Mostrar senha</span>
          </label>
        </div>
      </div>

      <button type="button" id="btnEntrar">Entrar</button>
    </form>

    {% if erro %}
      <p style="color: red; text-align: center; margin-top: 15px;">{{ erro }}</p>
    {% endif %}
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const senhaInput = document.getElementById('senha');
    const mostrarSenhaCheckbox = document.getElementById('mostrarSenhaCheckbox');
    const btnEntrar = document.getElementById('btnEntrar');

    // 1. Alternar visibilidade da senha
    mostrarSenhaCheckbox.addEventListener('change', function() {
      senhaInput.type = this.checked ? 'text' : 'password';
    });

    // 2. Fazer o botão "button" enviar o formulário para o Flask
    btnEntrar.addEventListener('click', function() {
      // reportValidity() faz o navegador exibir o aviso nativo se o email ou senha estiverem vazios
      if (loginForm.reportValidity()) {
        // Se tudo estiver preenchido, envia o formulário para a rota '/' do Flask
        loginForm.submit();
      }
    });

    // 3. BÔNUS: Permitir logar apertando a tecla "Enter" no teclado
    senhaInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault(); // Evita o comportamento padrão
        btnEntrar.click();  // Simula um clique no botão Entrar
      }
    });
  </script>
</body>
</html>
