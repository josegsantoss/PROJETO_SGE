        <!-- Linha decorativa -->
        <line x1="148" y1="372" x2="352" y2="372" stroke="#378ADD" stroke-width="1.5" opacity="0.6"/>
        <!-- Subtítulo -->

      </svg>
    </div>

    <h1>Bem-vindo</h1>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
        
        <div class="mostrar-senha-wrapper">
          <label class="checkbox-container">
            <input type="checkbox" id="mostrarSenhaCheckbox">
            <span>Mostrar senha</span>
          </label>
        </div>
      </div>

      <button type="button" id="btnEntrar">Entrar</button>
    </form>
  </div>

  <script>
    const senhaInput = document.getElementById('senha');
    const mostrarSenhaCheckbox = document.getElementById('mostrarSenhaCheckbox');

    mostrarSenhaCheckbox.addEventListener('change', function() {
      if (this.checked) {
        senhaInput.type = 'text';
      } else {
        senhaInput.type = 'password';
      }
    });

    const btnEntrar = document.getElementById('btnEntrar');
    
    btnEntrar.addEventListener('click', function() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      
      if (!email || !senha) {
        alert('Por favor, preencha e-mail e senha!');
        return;
      }
      
      window.location.href = 'menu.html';
    });

    document.getElementById('senha').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        btnEntrar.click();
      }
    });
  </script>
</body>
</html>
