<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificação em 2 Fatores</title>
    <!-- Ícone opcional (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <link rel="stylesheet" href="FA2.css">
    
  
</head>
<body>

    <div class="card" role="main" aria-labelledby="2fa-title">
        <!-- Ícone -->
        <div class="icon-wrapper">
            <i class="fas fa-shield-alt"></i>
        </div>

        <!-- Título -->
        <h1 id="2fa-title">Verificação em duas etapas</h1>
        <p class="subtitle">
            Insira o código de 6 dígitos enviado para
            <span id="user-email">usuario@exemplo.com</span>
        </p>

        <!-- Campos do código -->
        <div class="code-container" id="codeContainer">
            <input type="text" class="code-input" id="code1" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus />
            <input type="text" class="code-input" id="code2" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            <input type="text" class="code-input" id="code3" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            <input type="text" class="code-input" id="code4" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            <input type="text" class="code-input" id="code5" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            <input type="text" class="code-input" id="code6" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        </div>

        <!-- Mensagem de status -->
        <div class="message" id="message" aria-live="polite">
            <span id="messageText">Digite o código de 6 dígitos</span>
        </div>

        <!-- Botão verificar -->
        <button class="btn-verify" id="verifyBtn">
            <i class="fas fa-check-circle"></i> Verificar
        </button>

        <!-- Rodapé: reenviar + timer -->
        <div class="footer-actions">
            <button class="resend-link" id="resendBtn" disabled>
                <i class="fas fa-redo-alt"></i> Reenviar código
            </button>
            <span class="timer" id="timerDisplay">
                <i class="far fa-clock"></i> <span id="timerSeconds">30</span>s
            </span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== Referências DOM =====
            const inputs = [
                document.getElementById('code1'),
                document.getElementById('code2'),
                document.getElementById('code3'),
                document.getElementById('code4'),
                document.getElementById('code5'),
                document.getElementById('code6')
            ];

            const verifyBtn = document.getElementById('verifyBtn');
            const resendBtn = document.getElementById('resendBtn');
            const timerSecondsSpan = document.getElementById('timerSeconds');
            const messageText = document.getElementById('messageText');
            const messageContainer = document.getElementById('message');

            // ===== Estado =====
            let timerInterval = null;
            let remainingSeconds = 30;
            let isLocked = false; // impede ações durante animações / reenvio

            // Código correto (simulado)
            const CORRECT_CODE = '123456';

            // ===== Funções auxiliares =====

            // Limpa a mensagem (volta ao texto padrão)
            function setDefaultMessage() {
                messageText.textContent = 'Digite o código de 6 dígitos';
                messageContainer.className = 'message';
            }

            // Exibe mensagem de erro
            function setErrorMessage(msg) {
                messageText.textContent = msg;
                messageContainer.className = 'message error';
            }

            // Exibe mensagem de sucesso
            function setSuccessMessage(msg) {
                messageText.textContent = msg;
                messageContainer.className = 'message success';
            }

            // Remove qualquer estado de erro/sucesso dos campos
            function clearInputStates() {
                inputs.forEach(inp => {
                    inp.classList.remove('error', 'success');
                });
            }

            // Marca campos com erro
            function setInputsError() {
                inputs.forEach(inp => inp.classList.add('error'));
            }

            // Marca campos com sucesso
            function setInputsSuccess() {
                inputs.forEach(inp => inp.classList.add('success'));
            }

            // Obtém o código digitado como string
            function getEnteredCode() {
                return inputs.map(inp => inp.value).join('');
            }

            // Limpa todos os campos
            function clearInputs() {
                inputs.forEach(inp => {
                    inp.value = '';
                    inp.classList.remove('error', 'success');
                });
                // foco no primeiro
                inputs[0].focus();
            }

            // ===== Lógica do temporizador =====

            function startTimer(seconds) {
                // Cancela timer anterior se existir
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                remainingSeconds = seconds;
                timerSecondsSpan.textContent = remainingSeconds;
                resendBtn.disabled = true;

                timerInterval = setInterval(() => {
                    remainingSeconds -= 1;
                    timerSecondsSpan.textContent = remainingSeconds;

                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        timerSecondsSpan.textContent = '0';
                        resendBtn.disabled = false; // habilita reenvio
                        // mensagem informativa
                        setDefaultMessage();
                    }
                }, 1000);
            }

            // Reinicia o timer (chamado no reenvio)
            function resetTimer() {
                startTimer(30);
            }

            // ===== Ações =====

            // Verifica o código
            function verifyCode() {
                // Se estiver bloqueado (ex: processando), ignora
                if (isLocked) return;

                const code = getEnteredCode();
                const allFilled = code.length === 6;

                // Se não estiver completo, mostra erro e foca no primeiro vazio
                if (!allFilled) {
                    setErrorMessage('Preencha todos os 6 dígitos.');
                    // Encontra o primeiro input vazio e coloca foco
                    for (let i = 0; i < inputs.length; i++) {
                        if (inputs[i].value === '') {
                            inputs[i].focus();
                            break;
                        }
                    }
                    // Marca os inputs vazios com erro? melhor só mensagem.
                    // Mas podemos destacar os que não estão preenchidos
                    inputs.forEach(inp => {
                        if (inp.value === '') {
                            inp.classList.add('error');
                        } else {
                            inp.classList.remove('error');
                        }
                    });
                    return;
                }

                // Limpa estados de erro anteriores
                clearInputStates();

                // Verifica se o código está correto
                if (code === CORRECT_CODE) {
                    // Sucesso!
                    setSuccessMessage('✅ Código verificado com sucesso!');
                    setInputsSuccess();
                    // Desabilita o botão verificar para evitar múltiplos cliques
                    verifyBtn.disabled = true;
                    // Opcional: bloquear ações por um instante
                    isLocked = true;
                    setTimeout(() => {
                        isLocked = false;
                    }, 2000);
                } else {
                    // Código incorreto
                    setErrorMessage('❌ Código inválido. Tente novamente.');
                    setInputsError();
                    // Limpa os campos após 1.5s para nova tentativa
                    isLocked = true;
                    setTimeout(() => {
                        clearInputs();
                        setDefaultMessage();
                        isLocked = false;
                    }, 1500);
                }
            }

            // Reenvia o código (simula)
            function resendCode() {
                if (resendBtn.disabled) return; // segurança

                // Simula envio
                setDefaultMessage();
                messageText.textContent = '📨 Novo código enviado para seu e-mail.';
                messageContainer.className = 'message';

                // Limpa campos e estados
                clearInputs();
                clearInputStates();
                verifyBtn.disabled = false;

                // Reinicia o timer
                resetTimer();

                // Pequeno feedback visual
                resendBtn.disabled = true;
            }

            // ===== Event Listeners =====

            // Navegação automática entre inputs
            inputs.forEach((input, index) => {
                // Ao digitar, move para o próximo se preenchido
                input.addEventListener('input', function(e) {
                    // Permite apenas dígitos
                    this.value = this.value.replace(/\D/g, '');
                    if (this.value.length === 1) {
                        // Remove estados de erro/sucesso individuais
                        this.classList.remove('error', 'success');
                        // Se não for o último, foca no próximo
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            // Se for o último, tira o foco (ou mantém)
                            // Pode optar por dar foco no botão? não, melhor manter.
                        }
                    }
                    // Se o usuário colar algo, trataremos no evento paste
                });

                // Tecla Backspace: volta para o anterior
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Previne entrada não numérica
                input.addEventListener('keypress', function(e) {
                    const char = String.fromCharCode(e.which);
                    if (!/[0-9]/.test(char)) {
                        e.preventDefault();
                    }
                });

                // Suporte a colagem: preenche todos os campos
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasteData.replace(/\D/g, '').slice(0, 6);
                    if (digits.length > 0) {
                        for (let i = 0; i < inputs.length; i++) {
                            if (i < digits.length) {
                                inputs[i].value = digits[i];
                                inputs[i].classList.remove('error', 'success');
                            } else {
                                inputs[i].value = '';
                            }
                        }
                        // Foca no último preenchido ou no próximo vazio
                        const nextIndex = Math.min(digits.length, inputs.length - 1);
                        inputs[nextIndex].focus();
                    }
                });
            });

            // Botão verificar
            verifyBtn.addEventListener('click', verifyCode);

            // Enter no último input ou em qualquer input dispara verificação
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        // Se for o último ou se todos estão preenchidos, verifica
                        const code = getEnteredCode();
                        if (code.length === 6) {
                            verifyCode();
                        } else {
                            // Foca no próximo vazio
                            for (let i = 0; i < inputs.length; i++) {
                                if (inputs[i].value === '') {
                                    inputs[i].focus();
                                    break;
                                }
                            }
                        }
                    }
                });
            });

            // Botão reenviar
            resendBtn.addEventListener('click', resendCode);

            // ===== Inicialização =====
            function init() {
                // Garantir que os campos estejam limpos
                clearInputs();
                setDefaultMessage();
                verifyBtn.disabled = false;
                // Inicia timer com 30s
                startTimer(30);
                // Foco no primeiro campo
                inputs[0].focus();
            }

            init();

            // ===== Simular mudança de email (opcional) =====
            // Pode ser alterado via JS se quiser
            // document.getElementById('user-email').textContent = 'outro@email.com';

        })();
    </script>
</body>
</html>
